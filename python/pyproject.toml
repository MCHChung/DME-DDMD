[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydme"
version = "0.1.0"
description = "PyTorch implementation of Dynamic Mode Extraction via Temporal Matrix Integration (TMI) with sparse dynamics and feature models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dynamical-systems", "dimensionality-reduction", "sindy", "sparse-regression", "torch"]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["pydme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
